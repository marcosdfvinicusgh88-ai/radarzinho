# Configuração de deploy do site no Netlify.
# Site 100% estático — não há comando de build nem dependências para instalar.

[build]
  publish = "."
  command = ""

# Cabeçalhos de cache: arquivos com nome versionado (css/js) podem cachear
# bastante; HTML sempre revalida para garantir que a última versão publicada
# apareça na hora.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Página 404 personalizada (se existir na raiz do projeto)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
